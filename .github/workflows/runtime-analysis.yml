# ============================================================================
# Runtime analysis of com.nivaroid.topfollow on a real Android emulator.
#
# WHAT THIS GIVES YOU: genuine Frida logs from a live process — the thing that
# cannot be produced in a static sandbox. It boots an Android emulator, installs
# the APK, starts a matching frida-server, SPAWNs the app under ci/frida_runner.py
# with the dynamic-lab scripts, and uploads the captured output as an artifact.
#
# THE ONE CAVEAT, stated plainly (do not skip this):
#   GitHub-hosted runners are x86_64. KVM only accelerates an x86_64 system
#   image, so this workflow instruments the APK's **x86_64 build** of
#   libtopfollow.so (lib/x86_64/), NOT the arm64-v8a build. They are compiled
#   from the same source and carry the same AES tables, the same 22 JNI natives
#   and the same detection logic, so the runtime findings transfer — but if you
#   specifically need arm64-v8a instrumented, use a self-hosted arm64 runner
#   (bare-metal arm64 + KVM, or an arm64 Mac) or the rooted arm64 device / Nox
#   you already have; see ci/README notes at the bottom of this file.
#
# Trigger: manual (workflow_dispatch). Emulator boot is slow and flaky enough
# that you do not want it on every push.
# ============================================================================
name: runtime-analysis

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to let the instrumented app run (seconds)"
        required: false
        default: "90"
      api:
        description: "Android API level of the emulator image"
        required: false
        default: "30"

concurrency:
  group: runtime-analysis
  cancel-in-progress: true

jobs:
  frida-on-emulator:
    runs-on: ubuntu-latest          # x86_64
    timeout-minutes: 60
    steps:
      - name: Checkout (includes the committed APK)
        uses: actions/checkout@v4

      # --- KVM so the x86_64 emulator is hardware-accelerated -----------------
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "WARNING: /dev/kvm not present — boot will be slow (TCG)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python + frida host tools
        run: |
          python -m pip install --upgrade pip
          # match the version this repo was analysed with
          pip install "frida==17.18.0" "frida-tools==14.10.4"
          python -c "import frida; print('host frida', frida.__version__)"

      - name: AVD cache key
        id: avd-key
        run: echo "key=avd-api${{ github.event.inputs.api || 30 }}-x86_64" >> "$GITHUB_OUTPUT"

      - name: Restore AVD snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-key.outputs.key }}

      - name: Create AVD and generate snapshot (cache miss only)
        uses: reactivecircus/android-emulator-runner@v2
        if: steps.avd-cache.outputs.cache-hit != 'true'
        with:
          api-level: ${{ github.event.inputs.api || 30 }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 3072M
          disk-size: 8G
          avd-name: tf
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD created for snapshot"

      # --- the real run -------------------------------------------------------
      - name: Boot emulator, install APK, run Frida scripts, capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api || 30 }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 3072M
          disk-size: 8G
          avd-name: tf
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./ci/emulator_steps.sh ${{ github.event.inputs.seconds || 90 }}

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-runtime-logs
          path: |
            frida_logs.txt
            ci/*.log
            ci/*.json
          if-no-files-found: warn

# ----------------------------------------------------------------------------
# NEED arm64-v8a specifically?
#   Option A — self-hosted arm64 runner (bare-metal arm64 Linux with /dev/kvm,
#     or an Apple-silicon macOS runner). Change `runs-on` to your arm64 label and
#     set `arch: arm64-v8a` in both emulator steps; everything else is identical.
#   Option B — your rooted arm64 device / Nox: start frida-server on it, then run
#     ci/frida_runner.py --device usb (or --device host:port) locally. No CI needed.
#   x86_64 emulation of an arm64-only .so via Google's libndk translation does
#   NOT instrument cleanly (Frida Stalker/Interceptor do not follow translated
#   arm64->x86 code), so it is not a reliable substitute for a real arm64 target.
# ----------------------------------------------------------------------------
