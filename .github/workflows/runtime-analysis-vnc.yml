# ============================================================================
# Interactive variant: Android emulator + Web VNC (noVNC) in a GitHub Action.
#
# Use this when you need to WATCH or TOUCH the emulator — e.g. complete the
# Instagram login, solve a captcha, or navigate to the follow-task screen —
# before/while the Frida scripts capture. The live emulator screen is exposed
# through noVNC and surfaced as a GitHub Actions step summary link.
#
# Same caveat as runtime-analysis.yml: GitHub-hosted runners are x86_64, so this
# instruments the APK's x86_64 libtopfollow.so. For arm64-v8a use a self-hosted
# arm64 runner or your own device.
#
# The VNC session is only alive while the workflow runs, so it keeps the emulator
# up for `keep_alive_minutes`, runs the Frida capture part-way through, and
# uploads logs at the end.
# ============================================================================
name: runtime-analysis-vnc

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "Minutes to keep the VNC session (and emulator) alive"
        required: false
        default: "20"
      seconds:
        description: "Seconds to run the Frida capture"
        required: false
        default: "90"

concurrency:
  group: runtime-analysis-vnc
  cancel-in-progress: true

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Set up Python + frida
        run: pip install "frida==17.18.0" "frida-tools==14.10.4"

      # Xvfb + x11vnc + noVNC so the emulator window is reachable in a browser
      - name: Install VNC stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify fluxbox

      - name: Start Xvfb + fluxbox + x11vnc + noVNC
        run: |
          Xvfb :1 -screen 0 1280x800x24 &
          export DISPLAY=:1
          fluxbox &
          x11vnc -display :1 -forever -shared -nopw -listen 0.0.0.0 -rfbport 5900 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 3
          echo "  noVNC on :6080, VNC on :5900"
        env: { DISPLAY: ":1" }

      # Surface the live view through the run's step summary (works with the
      # Actions "open port" UI / a tunnel you add; see note below).
      - name: Publish VNC link
        run: |
          {
            echo "### Live emulator (Web VNC)"
            echo ""
            echo "noVNC is listening on port **6080** of the runner."
            echo "GitHub-hosted runners have no public inbound IP, so to view it:"
            echo "- open this job's **Summary** tab and use the port-forward/"
            echo "  'live preview' control your runner UI provides for port 6080, or"
            echo "- add a tunnel step (e.g. a cloudflared/ngrok step) and use its URL."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Boot emulator (visible in VNC), install APK, start frida-server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 3072M
          disk-size: 8G
          avd-name: tfvnc
          force-avd-creation: false
          # NOTE: no -no-window here — the emulator renders into Xvfb so VNC sees it
          emulator-options: -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export DISPLAY=:1
            adb wait-for-device
            adb install -g -r "TopFollow_v845-Beta (1).apk"
            bash ./ci/frida_server.sh 17.18.0
            echo "Emulator is live in VNC. Interact now (login/captcha) if needed."
            # give a human time to drive the UI, then capture
            sleep 120
            python ci/frida_runner.py --device usb --seconds \
              ${{ github.event.inputs.seconds || 90 }} --out frida_logs.txt \
              --scripts dynamic-lab/00_common.js \
                        dynamic-lab/01_anti_tamper_killer.js \
                        dynamic-lab/02_ssl_pinning_bypass.js \
                        dynamic-lab/03_instagram_api_intercept.js \
                        dynamic-lab/09_native_aes_dump.js \
                        dynamic-lab/10_java_crypto_layer.js
        env:
          DISPLAY: ":1"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-runtime-logs-vnc
          path: |
            frida_logs.txt
            ci/*.log
          if-no-files-found: warn
